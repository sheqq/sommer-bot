openapi: 3.1.0
info:
  title: sommer-facade
  description: REST API für sommer.de
  version: 1.0.0

servers:
  - url: /api/v1

security:
  - ApiKeyAuth: []

tags:
  - name: users
    description: Operationen rund um Nutzer

paths:
  /users:
    get:
      tags: [users]
      operationId: getAllUsers
      summary: Get all users
      responses:
        '200':
          description: Liste aller Nutzer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: Fehlender oder ungültiger API-Key
        '500':
          description: Interner Serverfehler, z. B. durch einen Datenbankfehler
    post:
      tags: [users]
      operationId: createUser
      summary: Neuen Nutzer erstellen (Client liefert id)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Nutzer erfolgreich erstellt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ungültige Nutzerdaten, z. B. fehlende ID
        '401':
          description: Fehlender oder ungültiger API-Key
        '500':
          description: Interner Serverfehler, z. B. durch einen Datenbankfehler

  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        description: ID des Nutzers
        schema:
          type: string
    get:
      tags: [users]
      operationId: getUserById
      summary: Nutzer nach ID abrufen
      responses:
        '200':
          description: Nutzer gefunden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Nutzer nicht gefunden
        '401':
          description: Fehlender oder ungültiger API-Key
        '500':
          description: Interner Serverfehler, z. B. durch einen Datenbankfehler
    put:
      tags: [users]
      operationId: updateUser
      summary: Nutzer anhand der Pfad-ID vollständig durch den Body ersetzen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Nutzer erfolgreich aktualisiert
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Nutzer nicht gefunden
        '401':
          description: Fehlender oder ungültiger API-Key
        '500':
          description: Interner Serverfehler, z. B. durch einen Datenbankfehler
    delete:
      tags: [users]
      operationId: deleteUser
      summary: Nutzer löschen
      responses:
        '204':
          description: Nutzer erfolgreich gelöscht
        '404':
          description: Nutzer nicht gefunden
        '401':
          description: Fehlender oder ungültiger API-Key
        '500':
          description: Interner Serverfehler, z. B. durch einen Datenbankfehler

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    User:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
          example: "2347247625478"
        username:
          type: string
          example: "Max"