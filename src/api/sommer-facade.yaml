openapi: 3.1.0
info:
  title: sommer-facade
  description: REST API für sommer-bot.vercel.app
  version: 0.0.3

servers:
  - url: https://sommer-bot.vercel.app/api/v1

security:
  - ApiKeyAuth: []

tags:
  - name: level
    description: Operationen rund um die Benutzerlevel
  - name: guild
    description: Operationen rund um die Server

paths:
  /guild:
    post:
      tags: [guild]
      operationId: createGuild
      summary: Server speichern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Guild'
      responses:
        '201':
          $ref: '#/components/responses/GuildSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /guild/{guildId}:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      tags: [guild]
      operationId: getGuildById
      summary: Server nach ID abrufen
      responses:
        '200':
          $ref: '#/components/responses/GuildSuccess'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [guild]
      operationId: updateGuild
      summary: Guild anhand der Pfad-ID vollständig durch den Body ersetzen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Guild'
      responses:
        '200':
          $ref: '#/components/responses/GuildSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /guild/{guildId}/level:
    parameters:
      - $ref: '#/components/parameters/GuildId'
    get:
      tags: [level]
      operationId: getAllLevels
      summary: Get all Levels
      responses:
        '200':
          $ref: '#/components/responses/LevelListSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [level]
      operationId: createLevel
      summary: Neues Level erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Level'
      responses:
        '201':
          $ref: '#/components/responses/LevelSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /guild/{guildId}/user/{userId}/level:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/GuildId'
    get:
      tags: [level]
      operationId: getUserById
      summary: Level nach ID abrufen
      responses:
        '200':
          $ref: '#/components/responses/LevelSuccess'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [level]
      operationId: updateLevel
      summary: Level anhand der Pfad-ID vollständig durch den Body ersetzen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Level'
      responses:
        '200':
          $ref: '#/components/responses/LevelSuccess'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [level]
      operationId: deleteLevel
      summary: Level löschen
      responses:
        '204':
          $ref: '#/components/responses/NoContentSuccess'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    GuildId:
      name: guildId
      in: path
      required: true
      description: ID des Servers
      schema:
        $ref: '#/components/schemas/GuildIdentifier'
    UserId:
      name: userId
      in: path
      required: true
      description: ID des Nutzers
      schema:
        $ref: '#/components/schemas/UserIdentifier'
  responses:
    GuildSuccess:
      description: Erfolgreiche Antwort mit Serverdaten
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Guild'
    LevelListSuccess:
      description: Erfolgreiche Antwort mit einer Liste von Leveln
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Level'
    LevelSuccess:
      description: Erfolgreiche Antwort mit Leveldaten
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Level'
    NoContentSuccess:
      description: Anfrage erfolgreich abgeschlossen
    BadRequest:
      description: Ungültige Nutzerdaten, z. B. fehlende ID
    Conflict:
      description: Die Ressource existiert bereits
    NotFound:
      description: Angeforderte Ressource nicht gefunden
    Unauthorized:
      description: Fehlender oder ungültiger API-Key
    InternalServerError:
      description: Interner Serverfehler
  schemas:
    ColorsEnabled:
      type: boolean
      example: true
    GuildIdentifier:
      type: string
      example: "2347247625478"
    UserIdentifier:
      type: string
      example: "Max"
    XP:
      type: integer
      example: 100
    LevelNumber:
      type: integer
      example: 5
    Level:
      type: object
      required:
        - guildId
        - userId
        - xp
      properties:
        guildId:
          $ref: '#/components/schemas/GuildIdentifier'
        userId:
          $ref: '#/components/schemas/UserIdentifier'
        xp:
          $ref: '#/components/schemas/XP'
        level:
          $ref: '#/components/schemas/LevelNumber'
    Guild:
      type: object
      required:
        - guildId
        - name
      properties:
        guildId:
          $ref: '#/components/schemas/GuildIdentifier'
        name:
          type: string
          minLength: 1
          example: Sommer Community
        iconUrl:
          description: HTTPS-URL zum Server-Profilbild oder null, wenn keines gesetzt ist
          anyOf:
            - type: string
              format: uri
            - type: "null"
        colorsEnabled:
          $ref: '#/components/schemas/ColorsEnabled'
    User:
      type: object
      required:
        - userId
        - guildId
      properties:
        userId:
          $ref: '#/components/schemas/UserIdentifier'
        guildId:
          type: array
          items:
            type: string
          example: ["2347247625478", "2347247625479"]